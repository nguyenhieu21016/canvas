<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif">
  <!-- Grid & Axes -->
  <line x1="70" y1="280" x2="520" y2="280" stroke="#181B16" stroke-width="1.8"/>
  <line x1="70" y1="280" x2="70" y2="30" stroke="#181B16" stroke-width="1.8"/>
  <!-- Arrows -->
  <polygon points="520,280 512,276 512,284" fill="#181B16"/>
  <polygon points="70,30 66,38 74,38" fill="#181B16"/>
  <!-- Axis titles -->
  <text x="82" y="34" font-size="13" font-style="italic" fill="#181B16" font-weight="600">Tần số tương đối (%)</text>
  <text x="455" y="318" font-size="13" font-style="italic" fill="#181B16" font-weight="600">Chiều dài (cm)</text>
  <text x="54" y="294" font-size="12" font-style="italic" fill="#181B16">O</text>

  <!-- Y ticks (0 to 50%, 10% = 44px, y50 = 60, y0 = 280) -->
  <g font-size="12" fill="#334155" text-anchor="end">
    <line x1="66" y1="236" x2="500" y2="236" stroke="#E4E6DE" stroke-dasharray="4 4"/>
    <text x="61" y="240">10</text>
    <line x1="66" y1="192" x2="500" y2="192" stroke="#E4E6DE" stroke-dasharray="4 4"/>
    <text x="61" y="196">20</text>
    <line x1="66" y1="148" x2="500" y2="148" stroke="#E4E6DE" stroke-dasharray="4 4"/>
    <text x="61" y="152">30</text>
    <line x1="66" y1="104" x2="500" y2="104" stroke="#E4E6DE" stroke-dasharray="4 4"/>
    <text x="61" y="108">40</text>
    <line x1="66" y1="60" x2="500" y2="60" stroke="#E4E6DE" stroke-dasharray="4 4"/>
    <text x="61" y="64">50</text>
  </g>

  <!-- Histogram Bars: width = 62px each, start at x = 120 -->
  <!-- [27;28): 5% -> h = 22, y = 258 -->
  <rect x="120" y="258" width="62" height="22" fill="#EEF2E6" stroke="#2D4A3E" stroke-width="1.6"/>
  <text x="151" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#181B16">5%</text>

  <!-- [28;29): 20% -> h = 88, y = 192 -->
  <rect x="182" y="192" width="62" height="88" fill="#DCE5D0" stroke="#2D4A3E" stroke-width="1.6"/>
  <text x="213" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#181B16">20%</text>

  <!-- [29;30): 50% -> h = 220, y = 60 -->
  <rect x="244" y="60" width="62" height="220" fill="#C4D4B4" stroke="#2D4A3E" stroke-width="1.6"/>
  <text x="275" y="53" text-anchor="middle" font-size="12" font-weight="600" fill="#181B16">50%</text>

  <!-- [30;31): 15% -> h = 66, y = 214 -->
  <rect x="306" y="214" width="62" height="66" fill="#DCE5D0" stroke="#2D4A3E" stroke-width="1.6"/>
  <text x="337" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#181B16">15%</text>

  <!-- [31;32): 10% -> h = 44, y = 236 -->
  <rect x="368" y="236" width="62" height="44" fill="#EEF2E6" stroke="#2D4A3E" stroke-width="1.6"/>
  <text x="399" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#181B16">10%</text>

  <!-- X labels -->
  <g font-size="12" fill="#181B16" text-anchor="middle">
    <text x="120" y="298">27</text>
    <text x="182" y="298">28</text>
    <text x="244" y="298">29</text>
    <text x="306" y="298">30</text>
    <text x="368" y="298">31</text>
    <text x="430" y="298">32</text>
  </g>
</svg>
